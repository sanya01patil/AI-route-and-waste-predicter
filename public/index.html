<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoChain AI – Decentralized Sustainable Transport</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .splash { text-align: center; animation: fadeIn 0.8s ease; }
    .splash-logo {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, #00ff88, #00c466);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; margin: 0 auto 20px;
      box-shadow: 0 0 40px rgba(0,255,136,0.5);
      animation: float 3s ease-in-out infinite;
    }
    h1 { margin-bottom: 8px; }
    p { color: #8baa98; margin-bottom: 24px; }
  </style>
</head>
<body>
  <canvas id="particles-canvas"></canvas>
  <div class="splash">
    <div class="splash-logo">🌿</div>
    <h1 class="gradient-text">EcoChain AI</h1>
    <p>Decentralized Sustainable Transport Optimization</p>
    <div class="spinner"></div>
  </div>
  <script src="/js/api.js"></script>
  <script>
    initParticles('particles-canvas');
    setTimeout(() => {
      if (getToken()) window.location.href = '/dashboard';
      else window.location.href = '/login';
    }, 1200);
  </script>
</body>
</html>
